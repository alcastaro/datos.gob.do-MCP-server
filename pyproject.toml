[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dominican-open-data-mcp"
version = "0.5.0"
description = "MCP server for datos.gob.do — Dominican Republic open government data portal (CKAN 2.11)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Alberto Castillo Aroca" }]
keywords = [
    "mcp",
    "datos-abiertos",
    "republica-dominicana",
    "open-data",
    "ckan",
    "gobierno",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "mcp>=1.9.0",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "duckdb>=1.0",
    "chardet>=5.2",
    "odfpy>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
]

[project.scripts]
datosgobdo-mcp = "datosgobdo_mcp.server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers --cov=datosgobdo_mcp --cov-report=term-missing --cov-fail-under=75"

[tool.coverage.run]
omit = [
    "src/datosgobdo_mcp/server.py",   # MCP tool wrappers: thin delegates, covered via live tests
    "src/datosgobdo_mcp/ckan.py",     # HTTP adapter: covered by RUN_LIVE_TESTS suite
]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false

[project.urls]
Homepage = "https://github.com/alcastaro/datos.gob.do-MCP-server"
Repository = "https://github.com/alcastaro/datos.gob.do-MCP-server"
Changelog = "https://github.com/alcastaro/datos.gob.do-MCP-server/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/alcastaro/datos.gob.do-MCP-server/issues"
Portal = "https://datos.gob.do"

[tool.hatch.build.targets.wheel]
packages = ["src/datosgobdo_mcp"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.15",
]
