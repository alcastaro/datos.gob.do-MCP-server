name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint + types + tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        # Two non-Linux jobs, each for a reason that already cost something.
        # macOS: the user base is desktop-heavy and Linux-only CI had already
        # hidden a real platform bug ($TMPDIR under /private/var).
        # Windows: the majority platform for this server's Dominican audience,
        # and until now the only one whose code path — the msvcrt cache lock,
        # the system-path denylist, os.O_NOFOLLOW being absent — was never
        # executed by CI at all. This job does not close that gap on its own:
        # it proves the suite passes on Windows, not that the lock behaves
        # under real contention, which still needs a machine and a human.
        include:
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies (with dev extras)
        run: uv sync --python ${{ matrix.python-version }} --group dev --extra dev

      - name: Lint (ruff)
        run: uv run --python ${{ matrix.python-version }} ruff check src/ tests/

      - name: Format check (ruff)
        run: uv run --python ${{ matrix.python-version }} ruff format --check src/ tests/

      - name: Type check (mypy)
        run: uv run --python ${{ matrix.python-version }} mypy src/datosgobdo_mcp/ --no-error-summary

      - name: Verify package imports
        run: |
          uv run --python ${{ matrix.python-version }} python -c "
          from datosgobdo_mcp import server, ckan, preview, analytics, cache, download
          assert hasattr(server, 'mcp')
          assert hasattr(server, 'main')
          assert callable(ckan.search_datasets)
          assert callable(preview.preview_resource_data)
          assert callable(analytics.aggregate_resource)
          assert callable(analytics.query_resource)
          print('OK: all modules import cleanly')
          "

      - name: Run pytest + coverage
        run: uv run --python ${{ matrix.python-version }} pytest -v

      # Backgrounding a process and signalling it is POSIX shell work; the
      # Windows equivalent below checks the same thing the flag exists for.
      - name: Verify entry point script
        if: runner.os != 'Windows'
        run: |
          uv run --python ${{ matrix.python-version }} datosgobdo-mcp < /dev/null &
          PID=$!
          sleep 2
          if kill -0 $PID 2>/dev/null; then
            echo "OK: datosgobdo-mcp launched"
            kill $PID
          else
            wait $PID
            EXIT=$?
            if [ $EXIT -eq 0 ]; then
              echo "OK: datosgobdo-mcp ran and exited cleanly on EOF"
            else
              echo "FAIL: datosgobdo-mcp died with exit $EXIT"
              exit 1
            fi
          fi

      # --version exists because a Windows tester reached for --help to find out
      # which version was installed, got a server waiting on stdin, and had no
      # way to answer the question. Anything other than the package version
      # here means the entry point is broken on the platform most of this
      # server's audience runs.
      - name: Verify entry point (Windows)
        if: runner.os == 'Windows'
        run: |
          $out = uv run --python ${{ matrix.python-version }} datosgobdo-mcp --version
          Write-Host $out
          if ($out -notmatch '^datosgobdo-mcp \d+\.\d+\.\d+$') {
            Write-Error "unexpected --version output: $out"
            exit 1
          }

      - name: Build distributable
        run: uv build

      # The published binary is linux_amd64 and the file it checks is the same
      # on every runner, so validating once on Linux is both correct and enough.
      - name: Validate server.json against MCP Registry
        if: runner.os == 'Linux'
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher validate
